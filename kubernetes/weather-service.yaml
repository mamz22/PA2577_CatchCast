apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-service
  template:
    metadata:
      labels:
        app: weather-service
    spec:
      containers:
      - name: weather-service
        image: markomunoz/weather-service:v1
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: WEATHER_API_URL
          value: https://api.open-meteo.com/v1/forecast
        - name: GEOCODING_API_URL
          value: https://nominatim.openstreetmap.org/reverse
        - name: GEOCODING_USER_AGENT
          value: CastCatch/0.1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: weather-service
spec:
  type: ClusterIP
  selector:
    app: weather-service
  ports:
  - name: http
    port: 8000
    targetPort: http
